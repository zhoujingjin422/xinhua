plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    signingConfigs {
        debug {
            storeFile file('weike1.jks')
            storePassword 'com.browser.weike'
            keyAlias 'weike1'
            keyPassword 'com.browser.weike'
        }
    }
    compileSdkVersion 32
    defaultConfig {
//        com.cp.dtlp.xinhua.android
        applicationId "com.browser.weaike"
        minSdk 24
        targetSdk 32
        versionCode 13
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        dataBinding = true
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation "androidx.recyclerview:recyclerview:1.2.1"
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    implementation 'com.geyifeng.immersionbar:immersionbar-ktx:3.2.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.1'
    implementation 'org.koin:koin-androidx-viewmodel:2.0.1'
    implementation "io.github.cymchad:BaseRecyclerViewAdapterHelper:3.0.14"
    //网络框架okgo-必须使用
    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.lzy.net:okrx2:2.0.2'
    implementation 'com.lzy.net:okserver:2.0.5'
//    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'io.github.razerdp:BasePopup:3.2.1'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.getActivity:ShapeView:9.0'
    implementation("org.greenrobot:eventbus:3.3.1")
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'org.apache.commons:commons-text:1.9'
    implementation files('libs/ads-sdk-pro-6.2.1.9.aar')
    implementation files('libs/anythink_banner.aar')
    implementation files('libs/anythink_china_core.aar')
    implementation files('libs/anythink_core.aar')
    implementation files('libs/anythink_interstitial.aar')
    implementation files('libs/anythink_native.aar')
    implementation files('libs/anythink_network_gdt.aar')
    implementation files('libs/anythink_network_pangle_china.aar')
    implementation files('libs/anythink_rewardvideo.aar')
    implementation files('libs/anythink_splash.aar')
    implementation files('libs/GDTSDK.unionNormal.4.591.1461.aar')
}